<article class="card">
  <h2 class="card__title mb-4">
    <a [routerLink]="['/materiel', item().id]">{{ item().name }}</a>
  </h2>
  <p>Catégorie : {{ item().category }}</p>
  <p>Numéro de série : {{ item().serialNumber }}</p>
  <p>
    @if (itemAvailability() === 'available') {
      <span class="badge badge--approved">Disponible</span>
    } @else {
      <span class="badge badge--pending">En maintenance</span>
    }
  </p>
</article>
